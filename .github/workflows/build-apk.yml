
name: Build AbuQaoud Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbuQaoudAndroid_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project
        run: |
          test -f AbuQaoudAndroid_Project.zip
          unzip -q AbuQaoudAndroid_Project.zip -d buildsrc
          test -f buildsrc/AbuQaoudAndroid/gradlew
          chmod +x buildsrc/AbuQaoudAndroid/gradlew

      - name: Build debug APK
        working-directory: buildsrc/AbuQaoudAndroid
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuQaoud-Android-APK
          path: buildsrc/AbuQaoudAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
